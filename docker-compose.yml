services:

  db:
    image: postgres:18
    container_name: phonebook-postgres
    environment:
      POSTGRES_DB: phonebook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5107
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build:
      context: ./phonebook-backend
    container_name: phonebook-backend-container
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./phonebook-frontend
    container_name: phonebook-frontend-container
    depends_on:
      - backend
    ports:
      - "5173:4173"

volumes:
  postgres_data: